*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{--u:calc(1*var(--u));--f:calc(1.2*var(--u))}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 20% 30%,#4a1a8a 0%,transparent 55%),radial-gradient(ellipse at 85% 75%,#7a1d6e 0%,transparent 50%),linear-gradient(180deg,#090228,#1c0a4a);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;touch-action:manipulation}
input,textarea{font-family:inherit;user-select:text;-webkit-user-select:text}
#bg{position:fixed;inset:0;z-index:0}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
#wrap{position:fixed;inset:0;z-index:1}
#stage{position:absolute;inset:0}
#view{position:absolute;inset:0}

/* glass + buttons */
.glass{background:linear-gradient(135deg,rgba(60,30,120,.72),rgba(30,12,80,.72));border:calc(1.5*var(--u)) solid rgba(255,255,255,.28);border-radius:calc(26*var(--u));box-shadow:0 calc(10*var(--u)) calc(40*var(--u)) rgba(20,0,60,.45),inset 0 calc(1*var(--u)) 0 rgba(255,255,255,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(8*var(--u));border:none;cursor:pointer;font-family:inherit;font-size:calc(22*var(--f));color:#fff;padding:calc(12*var(--u)) calc(24*var(--u));border-radius:calc(999*var(--u));background:linear-gradient(180deg,#ff7ae0,#b84dff);box-shadow:0 calc(6*var(--u)) 0 #6a1fa8,0 calc(10*var(--u)) calc(24*var(--u)) rgba(184,77,255,.5),inset 0 calc(2*var(--u)) 0 rgba(255,255,255,.45);transition:transform .12s cubic-bezier(.3,1.8,.5,1),filter .2s;text-shadow:0 calc(2*var(--u)) 0 rgba(0,0,0,.2);position:relative}
.btn:active,.btn.pressed{transform:translateY(calc(4*var(--u))) scale(.94);box-shadow:0 calc(2*var(--u)) 0 #6a1fa8,0 calc(4*var(--u)) calc(10*var(--u)) rgba(184,77,255,.4)}
.btn.mint{background:linear-gradient(180deg,#6fffe0,#14b8a6);box-shadow:0 calc(6*var(--u)) 0 #0b6e66,0 calc(10*var(--u)) calc(24*var(--u)) rgba(62,242,200,.4),inset 0 calc(2*var(--u)) 0 rgba(255,255,255,.5);color:#05302c;text-shadow:none}
.btn.blue{background:linear-gradient(180deg,#7fd8ff,#3b6dff);box-shadow:0 calc(6*var(--u)) 0 #1d3a9e,0 calc(10*var(--u)) calc(24*var(--u)) rgba(76,201,255,.4),inset 0 calc(2*var(--u)) 0 rgba(255,255,255,.45)}
.btn.gold{background:linear-gradient(180deg,#ffe78a,#ffae2b);box-shadow:0 calc(6*var(--u)) 0 #b06400,0 calc(10*var(--u)) calc(24*var(--u)) rgba(255,190,60,.45),inset 0 calc(2*var(--u)) 0 rgba(255,255,255,.6);color:#5a2b00;text-shadow:none}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 calc(2*var(--u)) rgba(255,255,255,.35);}
.btn.sm{font-size:calc(17*var(--f));padding:calc(8*var(--u)) calc(16*var(--u))}
.btn.lg{font-size:calc(30*var(--f));padding:calc(18*var(--u)) calc(40*var(--u))}
.btn[disabled]{filter:grayscale(.8) brightness(.7);pointer-events:none}
.btn.sel{outline:calc(4*var(--u)) solid #fff;outline-offset:calc(3*var(--u))}
.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(calc(-14*var(--u))) rotate(2deg)}}
.bounce{animation:bounce .9s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(-10*var(--u)))}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(calc(-10*var(--u)))}40%,80%{transform:translateX(calc(10*var(--u)))}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.neon{text-shadow:0 0 calc(8*var(--u)) #ff7ae0,0 0 calc(22*var(--u)) #b84dff,0 calc(3*var(--u)) 0 #4a0f86}
.mintt{color:#6fffe0}.pinkt{color:#ff9ee8}.goldt{color:#ffe07a}.blut{color:#8fe0ff}
h1,h2,h3{margin:0;font-weight:normal}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;height:calc(70*var(--u));display:flex;align-items:center;gap:calc(12*var(--u));padding:calc(10*var(--u)) calc(18*var(--u));z-index:20}
.chip{display:flex;align-items:center;gap:calc(6*var(--u));padding:calc(6*var(--u)) calc(14*var(--u));border-radius:calc(999*var(--u));background:rgba(10,0,40,.55);border:calc(1.5*var(--u)) solid rgba(255,255,255,.25);font-size:calc(20*var(--f))}
.xpbar{width:calc(130*var(--u));height:calc(12*var(--u));border-radius:calc(9*var(--u));background:rgba(255,255,255,.15);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#6fffe0,#ff7ae0);border-radius:calc(9*var(--u));transition:width .6s}
.iconbtn{width:calc(52*var(--u));height:calc(52*var(--u));border-radius:50%;border:none;font-size:calc(26*var(--f));cursor:pointer;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 calc(2*var(--u)) rgba(255,255,255,.3);color:#fff;transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.iconbtn:active{transform:scale(.85)}

/* layouts */
.screen{position:absolute;inset:0;padding:calc(80*var(--u)) calc(22*var(--u)) calc(18*var(--u))}
.row{display:flex;gap:calc(14*var(--u));align-items:center}
.col{display:flex;flex-direction:column;gap:calc(12*var(--u))}
.center{display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:calc(8*var(--u));flex-wrap:wrap}
.tab{padding:calc(9*var(--u)) calc(18*var(--u));border-radius:calc(999*var(--u));background:rgba(255,255,255,.1);border:calc(1.5*var(--u)) solid rgba(255,255,255,.25);font-size:calc(19*var(--f));cursor:pointer;transition:all .2s}
.tab.on{background:linear-gradient(180deg,#6fffe0,#14b8a6);color:#04312c;border-color:#fff;transform:scale(1.05)}
.tab .ck{color:#ffe07a}
.bubble{position:relative;background:#fff;color:#3b1170;border-radius:calc(22*var(--u));padding:calc(14*var(--u)) calc(18*var(--u));font-size:calc(20*var(--f));line-height:1.45;box-shadow:0 calc(6*var(--u)) calc(18*var(--u)) rgba(0,0,0,.25)}
.bubble:after{content:'';position:absolute;left:calc(-14*var(--u));top:calc(26*var(--u));border:calc(10*var(--u)) solid transparent;border-right:calc(16*var(--u)) solid #fff}
.bubble b{color:#d4148f}
.note-box{font-size:calc(19*var(--f));line-height:1.6}
.big-emoji{font-size:calc(70*var(--f));line-height:1}
.pill{display:inline-block;padding:calc(3*var(--u)) calc(12*var(--u));border-radius:calc(999*var(--u));background:rgba(255,255,255,.15);font-size:calc(16*var(--f))}

/* modal */
.modal-bg{position:absolute;inset:0;background:rgba(5,0,30,.65);z-index:40;display:flex;align-items:center;justify-content:center;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.modal{padding:calc(30*var(--u)) calc(40*var(--u));min-width:calc(520*var(--u));max-width:calc(900*var(--u));text-align:center}
.stars3{font-size:calc(64*var(--f));letter-spacing:calc(6*var(--u))}
.stars3 span{display:inline-block;filter:grayscale(1) brightness(.5)}
.stars3 span.on{filter:none;animation:starin .6s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starin{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}

/* map */
.planet{position:absolute;cursor:pointer;text-align:center;transition:transform .2s}
.planet:active{transform:scale(.92)}
.planet .orb{border-radius:50%;position:relative;box-shadow:inset calc(-14*var(--u)) calc(-14*var(--u)) calc(30*var(--u)) rgba(0,0,0,.45),inset calc(10*var(--u)) calc(10*var(--u)) calc(24*var(--u)) rgba(255,255,255,.45),0 0 calc(40*var(--u)) var(--glow)}
.planet .ring{position:absolute;left:-22%;top:40%;width:144%;height:24%;border-radius:50%;border:calc(5*var(--u)) solid rgba(255,255,255,.55);transform:rotate(-18deg);pointer-events:none}
.planet .lbl{margin-top:calc(6*var(--u));font-size:calc(18*var(--f));text-shadow:0 calc(2*var(--u)) calc(6*var(--u)) #000;white-space:nowrap}
.planet .prog{font-size:calc(15*var(--f));color:#ffe07a}
.planet .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(40*var(--f))}
.planet.locked{filter:grayscale(.9) brightness(.5)}

/* score */
.scorewrap{background:#fffdf7;border-radius:calc(20*var(--u));padding:calc(6*var(--u));box-shadow:0 calc(8*var(--u)) calc(30*var(--u)) rgba(0,0,0,.35)}
svg.score .nh{fill:#1b1033;transition:fill .15s}
svg.score .st{stroke:#1b1033;stroke-width:2}
svg.score .lyr{font-size:19PX;fill:#2b1850;font-family:'Jua',sans-serif}
svg.score g.note.on .nh{fill:#ff2fb3}
svg.score g.note.on .lyr{fill:#ff2fb3;font-size:23PX}
svg.score g.note.on .st{stroke:#ff2fb3}
svg.score g.note.found .nh{fill:#10b981}
svg.score g.note.found .sdot{fill:#10b981}
svg.score g.note.flat-on .nh{fill:#8b5cf6}
svg.score .barhl{fill:rgba(255,122,224,.18);transition:opacity .2s}
svg.score .tap{cursor:pointer}
svg.score .glow{filter:drop-shadow(0 0 calc(6*var(--u)) #ff2fb3)}

/* generic cards */
.card{padding:calc(12*var(--u)) calc(16*var(--u));border-radius:calc(18*var(--u));background:rgba(255,255,255,.12);border:calc(2*var(--u)) solid rgba(255,255,255,.3);cursor:pointer;font-size:calc(20*var(--f));transition:transform .15s cubic-bezier(.3,1.8,.5,1),background .2s;text-align:center}
.card:active{transform:scale(.92)}
.card.sel{background:rgba(111,255,224,.3);border-color:#6fffe0}
.wcard{display:inline-block;padding:calc(8*var(--u)) calc(14*var(--u));margin:calc(4*var(--u));border-radius:calc(14*var(--u));background:linear-gradient(180deg,#fff,#e7dcff);color:#4a1b8c;font-size:calc(20*var(--f));cursor:grab;box-shadow:0 calc(4*var(--u)) 0 #a78bfa;touch-action:none}
.wcard.dragging{opacity:.4}
.dragghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) scale(1.15) rotate(-4deg)}
.slot{min-width:calc(92*var(--u));height:calc(92*var(--u));border-radius:calc(18*var(--u));border:calc(3*var(--u)) dashed rgba(255,255,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(16*var(--f));background:rgba(255,255,255,.06);transition:all .2s;cursor:pointer}
.slot.filled{border-style:solid;background:rgba(255,122,224,.22);border-color:#ff9ee8}
.slot.hot{transform:scale(1.08);border-color:#6fffe0;box-shadow:0 0 calc(20*var(--u)) #6fffe0}
.slot.now{box-shadow:0 0 0 calc(4*var(--u)) #ffe07a,0 0 calc(30*var(--u)) #ffe07a;transform:scale(1.08)}
.slot .e{font-size:calc(38*var(--f))}
.meter{width:calc(46*var(--u));height:calc(300*var(--u));border-radius:calc(24*var(--u));background:rgba(255,255,255,.1);position:relative;overflow:hidden;border:calc(2*var(--u)) solid rgba(255,255,255,.3)}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#6fffe0,#ffe07a,#ff4fd8);transition:height .06s}
.meter .band{position:absolute;left:calc(-2*var(--u));right:calc(-2*var(--u));border:calc(3*var(--u)) solid #fff;border-radius:calc(8*var(--u));background:rgba(255,255,255,.18)}
